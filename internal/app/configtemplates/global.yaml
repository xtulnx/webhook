# 全局配置：webhook --config webhook.yaml
# 必改项：hooks 指向自己的 Hook 数组文件；命令和目录按部署账号准备权限。
# 相对 hooks/证书/日志/命令目录基于进程工作目录，不基于本配置目录。
# 只有 network-config 及 network 内凭据/CA 路径基于配置文件目录。
# 保持单文件程序运行；生成模板不会启动服务或执行业务命令。

# 【监听】默认仅本机；需要对外提供服务时显式修改 IP，并配置访问控制/TLS。
ip: 127.0.0.1
port: 9000
urlprefix: hooks
status-path: status
# socket: /run/webhook/business.sock  # Unix；Windows 可填命名管道，设置后忽略 IP/port。

# 【来源与生效】hooks 文件顶层是数组，hook 模板顶层是一个对象，不能混用。
hooks: ["./hooks.yaml"]
hotreload: true
runtime-dir: "./.runtime"  # 私有目录，用于 CLI 检测实例及确认 Hook 刷新；父目录需存在。
nopanic: true             # 初次空 Hook 可启动；/status 可能显示 degraded，HTTP 仍为 200。
# hooks-dir: [./hooks.d]  # 需预先创建；非递归扫描 JSON/YAML，自动监听新增/删除。
# template: true          # 仅 Hook 支持 Go 模板 getenv/cat/credential；启用后配置写入只读。

# 【执行与上传】单 Hook 可覆盖超时和并发；异步 HTTP 接受不代表执行成功。
command-timeout: 30s
max-concurrency: 2         # 每个 Hook 的并发上限，0 不限制；达到上限拒绝，不排队/重试。
max-body-size: 10485760    # 10 MiB，0 不限制。大制品上传需显式提高并配合代理限制。
max-multipart-mem: 1048576 # 超过此内存阈值的 multipart 内容可能落盘。

# 【真实来源】只信任受控代理；白名单/黑名单只能选择一种。
# real-ip-header: X-Forwarded-For
# trusted-proxies: 127.0.0.1,::1
# access-whitelist: 127.0.0.1,::1
# access-blacklist: 192.0.2.0/24

# 【日志】verbose 可能包含参数、映射环境值和脚本输出；debug 还会包含请求体。
verbose: false
# debug: false
# logfile: ./webhook.log
# x-request-id: true
# x-request-id-limit: 128
# header: ["X-Service=webhook"]  # 全局响应头，不是请求头或命令环境变量。
# pidfile: ./webhook.pid
# setuid: 1000  # Unix 降权；必须同时设置 setgid，不能与 socket 同用。
# setgid: 1000

# 【其他能力入口】按场景生成独立模板，不必记住每个字段。
# Admin/TOTP/JWT：webhook config template admin
# HTTPS/私有证书：webhook config template tls
# Hub/Agent/级联：webhook config template hub / agent / both
# 独立组网文件：webhook config template network-hub；然后取消下一行注释。
# network-config: ./network.yaml  # 与内联 network 二选一，不要同时设置。
# CLI 更新：webhook update check/apply/rollback；更新后显式重启服务。
# update-enabled: true           # 只控制 Admin 的检查能力，不控制独立 CLI。
# update-repository: xtulnx/webhook
# 系统服务：webhook service install --help（Linux 已实现，实机验收待完成；Windows 待实现）。
# 临时入网/只读共享/TCP 转发：webhook agent --help，不是常驻 Agent 的配置文件入口。
# 本地上下文测试：webhook config template context；explain 不执行，test --execute 执行。
# 完整字段说明：docs/Webhook-Parameters.md；当前版本真实能力以 --help 为准。
