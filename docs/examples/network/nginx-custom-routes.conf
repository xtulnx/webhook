# 放在 Nginx http 作用域。若容器使用 Linux host 网络，后端走宿主机回环。
map $http_upgrade $webhook_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name a.abc.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $webhook_connection_upgrade;
    proxy_read_timeout 75s;

    location ^~ /team/agent/v1/ {
        proxy_pass http://127.0.0.1:9000/agent/v1/;
    }

    location ^~ /s/ {
        access_log off;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass http://127.0.0.1:9000/downloads/;
    }

    location ^~ /hooks_sub/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location ^~ /hooks_a1_v1/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location ^~ /release/ {
        proxy_pass http://127.0.0.1:9000;
    }
    location = /deploy-web {
        proxy_pass http://127.0.0.1:9000;
    }
    location = /status {
        proxy_pass http://127.0.0.1:9000;
    }
    location / {
        return 404;
    }
}
